<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardships</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand" id="brand">Cardships</div>
    <div class="hud" id="hud"></div>
  </header>
  <main class="layout">
    <div class="main-col">
      <section class="scene-wrap" id="scene-wrap" aria-label="Flight view">
        <canvas id="scene"></canvas>
        <div class="scene-overlay" id="scene-overlay"></div>
      </section>
      <section class="stage" id="stage" aria-live="polite"></section>
    </div>
    <aside class="logpanel">
      <div class="logpanel-head">Ship's log</div>
      <ol class="log" id="log"></ol>
    </aside>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/meta.js"></script>
<script src="js/skymap.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
