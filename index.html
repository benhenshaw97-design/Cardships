<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardships</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand" id="brand">Cardships</div>
    <div class="hud" id="hud"></div>
    <div class="tools" id="tools"></div>
    <button class="icon-btn" id="settings-btn" aria-haspopup="dialog" aria-controls="settings"><img src="assets/art/ui/btn-gear.png" alt=""><span class="tool-txt">Settings</span></button>
  </header>
  <div class="settings" id="settings" role="dialog" aria-label="Settings" hidden></div>
  <div class="sheet-back" id="sheet" hidden></div>
  <main class="layout">
    <div class="main-col">
      <section class="scene-wrap" id="scene-wrap" aria-label="Flight view">
        <canvas id="scene"></canvas>
        <div class="scene-overlay" id="scene-overlay"></div>
        <div class="battle-ui" id="battle-ui"></div>
      </section>
      <div class="scene-dock" id="scene-dock"></div>
      <section class="stage" id="stage" aria-live="polite"></section>
    </div>
    <aside class="logpanel">
      <div class="logpanel-head" id="log-head">Ship's log</div>
      <ol class="log" id="log"></ol>
    </aside>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/meta.js"></script>
<script src="js/skymap.js"></script>
<script src="js/scene.js"></script>
<script src="js/sprites.js"></script>
<script src="js/shipart.js"></script>
<script src="js/actors.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/artgen.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
